name: Android Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (defaults to current)"
        required: false
        type: string
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release-apk
          - release-aab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build with EAS local
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          set -euo pipefail

          case "${{ inputs.build_type }}" in
            debug)
              PROFILE=development
              ;;
            release-apk)
              PROFILE=production
              ;;
            release-aab)
              PROFILE=playstore
              ;;
            *)
              echo "Unknown build type: ${{ inputs.build_type }}"
              exit 1
              ;;
          esac

          eas build --platform android --profile "$PROFILE" --local

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-${{ inputs.build_type }}
          path: android/app/build/outputs/**/*.{apk,aab}
          if-no-files-found: error
