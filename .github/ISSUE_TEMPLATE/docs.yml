name: Documentation issue
description: Something in the README, release notes, or in-app help is wrong, missing, or confusing.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which document and what should change. Screenshots are welcome, but please do not include private audio or video files.

  - type: dropdown
    id: area
    attributes:
      label: Where is the documentation problem?
      options:
        - README
        - Release notes / GitHub release
        - In-app text or error message
        - Build / installation instructions
        - Privacy policy
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Exact location
      description: Section heading, URL, or screen name.
      placeholder: "README → Getting Started"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix
    validations:
      required: false
